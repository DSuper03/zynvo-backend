name: Leaderboard checks

on:
  pull_request:
    paths:
      - 'src/**'
      - 'prisma/**'
      - 'test/leaderboard*.test.ts'
      - 'package*.json'
      - 'tsconfig*.json'
      - '.github/workflows/leaderboard-check.yml'

permissions:
  contents: read

jobs:
  leaderboard:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: leaderboard_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      LEADERBOARD_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/leaderboard_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx prisma generate
      - run: npx prisma validate
      - run: npm run type-check
      - run: npm run type-check:worker
      - run: npm run test:leaderboard
