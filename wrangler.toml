name = "zynvo-backend-worker"
main = "src/worker/index.ts"
tsconfig = "tsconfig.worker.json"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]
# DATABASE_URL, JWT_SECRET, SENDGRID_API_KEY etc. are set in the dashboard as
# variables; without this every deploy (CLI or Git build) replaces them with
# the [vars] below and the worker loses its database.
keep_vars = true

# ── Non-secret config vars ────────────────────────────────────
# Secrets (JWT_SECRET, DATABASE_URL, FIREBASE_*, CLERK_SECRET_KEY, ADMIN_EMAILS)
# are stored via: npx wrangler secret put <KEY>
# Never put secrets in this file.

[vars]
NODE_ENV = "production"
FE_URL = "https://www.zynvosocial.com"

# ── Deployment environments ───────────────────────────────────

[env.production]
name = "zynvo-backend-worker"
vars = { NODE_ENV = "production", FE_URL = "https://www.zynvosocial.com" }

[env.staging]
name = "zynvo-backend-worker-staging"
vars = { NODE_ENV = "staging", FE_URL = "http://localhost:3000" }
